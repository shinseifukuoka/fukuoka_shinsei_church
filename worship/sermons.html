<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メッセージ・週報 | 福岡新生キリスト教会</title>
  <meta name="description" content="聖日礼拝のメッセージ動画・スライド、週報（PDF）、早天祈祷会の聖書箇所を公開しています。">
  <link rel="icon" href="../assets/img/common/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css?v=20260929">
  <script src="../assets/js/config.js?v=20260929" defer></script>
  <script src="../assets/js/data/weekly.js?v=20260929" defer></script>
  <script src="../assets/js/layout.js?v=20260929" defer></script>
</head>
<body data-root="../" data-page="worship-sermons">

  <section class="p-hero">
    <h1 class="p-hero__title">メッセージ・週報</h1>
    <p class="p-hero__lead">ご自宅での黙想や、礼拝の振り返りにご活用ください</p>
  </section>

  <!-- 💡 이 페이지 내용은 모두 assets/js/data/weekly.js 에서 자동 생성됩니다 -->
  <main class="l-main" id="main">

    <div class="js-fs-verse" hidden></div>

    <section class="c-card" id="sermons">
      <h2 class="c-heading">🎥 礼拝メッセージ</h2>
      <p class="c-lead">主日礼拝で語られた聖書のメッセージ映像と、メッセージ用スライド（PPT）を公開しています。</p>
      <div class="js-sermon-latest"></div>
      <div class="js-sermon-list"></div>
    </section>

    <section class="c-card" id="bulletin">
      <h2 class="c-heading">📄 週報（過去5週分）</h2>
      <p class="c-lead">画像を押すと大きく表示されます。</p>
      <!-- 管理画面「週報・暗誦聖句」でアップロードした週報が自動で表示されます -->
      <div class="js-fs-bulletin"></div>
    </section>

    <section class="c-card" id="morning">
      <h2 class="c-heading">🌅 早天祈祷会（朝のお祈り会）</h2>
      <p class="c-lead">毎朝5時からの早天祈祷会で分かち合っている御言葉の箇所です。皆様の朝のディボーションにお役立てください。</p>
      <ul class="c-linklist js-morning-list"></ul>
    </section>

  </main>
