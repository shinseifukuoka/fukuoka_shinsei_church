<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>管理画面 | 福岡新生キリスト教会</title>
  <link rel="icon" href="../assets/img/common/favicon.ico" sizes="any">
  <link rel="icon" href="../assets/img/common/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/img/common/apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="theme-color" content="#122844">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css?v=20261004">
  <link rel="stylesheet" href="admin.css?v=20261004">
  <script src="../assets/js/config.js?v=20261004" defer></script>
  <script src="../assets/js/firebase.js?v=20261004" defer></script>
  <script src="../assets/js/data/weekly.js?v=20261004" defer></script>
  <!-- タブは下の順番で表示されます -->
  <script src="js/core.js?v=20261004" defer></script>
  <script src="js/dashboard.js?v=20261004" defer></script>
  <script src="js/bulletin.js?v=20261004" defer></script>
  <script src="js/sermons.js?v=20261004" defer></script>
  <script src="js/shokudo.js?v=20261004" defer></script>
  <script src="js/album.js?v=20261004" defer></script>
  <script src="js/mission.js?v=20261004" defer></script>
  <script src="js/people.js?v=20261004" defer></script>
  <script src="js/settings.js?v=20261004" defer></script>
  <script src="js/feedback.js?v=20261004" defer></script>
</head>
<body class="a-body">

  <!-- ログイン画面 -->
  <section class="a-login js-login-view">
    <form class="a-card js-login-form">
      <img class="a-login__logo" src="../assets/img/common/logo-header.webp" alt="福岡新生キリスト教会">
      <h1>管理画面ログイン</h1>
      <div class="a-field">
        <label for="loginEmail">メールアドレス</label>
        <input id="loginEmail" type="email" autocomplete="username" required>
      </div>
      <div class="a-field">
        <label for="loginPass">パスワード</label>
        <input id="loginPass" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="c-btn c-btn--navy c-btn--block">ログイン</button>
      <p class="a-msg js-login-msg" role="status"></p>
      <p class="u-center"><button type="button" class="a-link js-reset">パスワードを忘れた方</button></p>
    </form>
  </section>

  <!-- 管理画面 -->
  <div class="js-admin-view" hidden>
    <header class="a-bar">
      <div class="a-bar__inner">
        <p class="a-bar__title"><img src="../assets/img/common/favicon.png" alt="">管理画面</p>
        <span class="a-bar__user js-user"></span>
        <a href="../" target="_blank" rel="noopener">サイトを見る ↗</a>
        <button type="button" class="js-logout">ログアウト</button>
      </div>
    </header>
    <nav class="a-tabs"><div class="a-tabs__list js-tabs"></div></nav>
    <main class="a-main js-panels"></main>
  </div>

  <div class="a-toast js-toast" hidden role="status"></div>
</body>
</html>
